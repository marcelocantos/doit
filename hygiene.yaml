# hygiene.yaml — declared, drift-validated hygiene posture for doit.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`. Sibling
# to bullseye.yaml: bullseye tracks aspirational state ("achieve X"); hygiene
# tracks steady-state ("we maintain X").
#
# Tiers are PER DIMENSION (schema v1). For each dimension the held tier is the
# highest T such that every item in that dimension with tier <= T is satisfied.
# `floors` is the per-dimension ratchet: a dimension dropping below its floor
# is DRIFT and fails the check. `aspires` is the gap horizon for reporting.
# `enforce` is intent-only metadata and does NOT affect tiers.

schema_version: 1

repo: doit
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 1   # go test in CI (ubuntu only); no OS matrix, race, or fuzz
  security: 2      # go.sum pin + GitHub secret scanning; no govulncheck/SAST
  quality: 1       # go vet in CI; gofmt/golangci not gated
  deps: 2          # go.sum committed; no Dependabot
  release: 2       # CI-built multi-arch tarballs + Homebrew; no CHANGELOG
  governance: 2    # Apache-2.0 + squash-only; no SECURITY.md / branch protection
  build: 2         # Makefile + pinned Go + MAKEFLAGS -j
  docs: 2          # STABILITY.md + threat model; no CI link check
  perf: 0          # no benchmark suite
  vcs: 0           # no committed git hooks
  agent: 2         # CLAUDE.md + bullseye.yaml + --help-agent

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # matrix, lint/format, release + governance
  3: hardened    # security scanning, SBOM/signing, fuzzing, perf

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.tests
    dim: correctness
    desc: "go test ./... runs on every push/PR (ci.yml `build` job)"
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {ci_step: {workflow: ci.yml, name: Test}}

  - id: correctness.make-test
    dim: correctness
    desc: "`make test` is the local shipped test path"
    state: present
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {make_target: test}

  - id: correctness.test-matrix
    dim: correctness
    desc: Unit tests run on macOS arm64 and Linux amd64/arm64, not ubuntu-latest only
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: >-
      CI is a single ubuntu-latest job (go build/vet/test). Release builds
      darwin-arm64, linux-amd64, and linux-arm64 but does not run tests there.
    evidence: {absent: {ci_job: "ci.yml#build:macOS"}}

  - id: correctness.race
    dim: correctness
    desc: go test -race runs in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      CI runs go test without -race. Concurrent policy-store and audit-log
      gaps (T43-T44) have no race net.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: Race}}}

  - id: correctness.fuzz
    dim: correctness
    desc: Fuzz harnesses over Starlark/policy/command parsing
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No go-fuzz/native fuzz targets; parser and policy surface is unit-tested only.
    evidence: {absent: {make_target: fuzz}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.dep-pinning
    dim: security
    desc: go.sum committed — reproducible, pinned module graph
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: go.sum}}

  - id: security.secret-scan-github
    dim: security
    desc: GitHub secret scanning and push protection are enabled
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: security_and_analysis.secret_scanning.status, equals: enabled}}

  - id: security.gitleaks
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit and/or CI
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: Relying on GitHub secret scanning; no gitleaks config or CI job yet.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.dep-vuln-scan
    dim: security
    desc: govulncheck (or equivalent) scans the module graph in CI
    state: planned
    cadence: periodic:30d
    enforce: warning
    tier: 3
    reason: Small direct dep set (mcp-go, starlark, yaml.v3) but no automated vuln scan. Dependabot alerts are off.
    evidence: {absent: {scanner: {tool: govulncheck}}}

  - id: security.sast
    dim: security
    desc: CodeQL static analysis for Go
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: CodeQL is not enabled; go vet is the only static gate.
    evidence: {absent: {ci_job: "ci.yml#codeql"}}

  - id: security.actions-perms
    dim: security
    desc: GitHub Actions default token permissions scoped to least privilege
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: >-
      ci.yml has no top-level permissions block (inherits repo default).
      release.yml sets contents write for asset upload.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: permissions}}}

  - id: security.signed-releases
    dim: security
    desc: Release artifacts carry provenance / are signed (cosign/sigstore)
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: >-
      release.yml uploads unsigned tarballs via gh release; Homebrew
      skip_checksum is true.
    evidence: {absent: {ci_step: {workflow: release.yml, name: Sign}}}

  # ============================== CODE QUALITY ============================
  - id: quality.vet
    dim: quality
    desc: "go vet ./... runs in CI and as `make vet`"
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {ci_step: {workflow: ci.yml, name: Vet}}

  - id: quality.format
    dim: quality
    desc: Sources are gofmt-clean, enforced in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: No gofmt/gofumpt --check step in CI; formatting is by-hand convention.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: Format}}}

  - id: quality.golangci
    dim: quality
    desc: golangci-lint (or staticcheck) is a CI gate
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      No .golangci.yml; golangci-lint is not invoked in CI. An entropy audit
      (2026-08-22) found 27 issues under default linters, locally only.
    evidence: {absent: {scanner: {tool: golangci-lint}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.lockfile
    dim: deps
    desc: "go.sum is committed so `go mod verify` has a pin to check"
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go.sum}}

  - id: deps.dependabot
    dim: deps
    desc: Dependabot (or equivalent) opens PRs for module advisories
    state: planned
    cadence: periodic:7d
    enforce: informational
    tier: 3
    reason: Dependabot security updates and vulnerability alerts are disabled; no .github/dependabot.yml.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.semver-minor
    dim: release
    desc: Published tags bump MINOR only (patch always 0)
    state: enforced
    cadence: per-release
    enforce: blocking
    tier: 2
    evidence:
      command: test "$(git tag -l 'v*' | sed 's/.*\.//' | sort -u)" = "0"

  - id: release.ci-built
    dim: release
    desc: Release binaries are built by CI across darwin-arm64, linux-amd64, linux-arm64
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: "release.yml#build"}

  - id: release.homebrew
    dim: release
    desc: Published to the Homebrew tap on release
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {ci_job: "release.yml#homebrew"}

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: History lives in git + GitHub release notes; no curated CHANGELOG.md yet.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: Apache-2.0 LICENSE present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: LICENSE, matches: 'Apache License'}}

  - id: governance.readme
    dim: governance
    desc: README present and current
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers bin/, coverage, IDE/OS files, agent state
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only, with delete-branch-on-merge
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy yet.
    evidence: {absent: {file: {path: SECURITY.md}}}

  - id: governance.branch-protection
    dim: governance
    desc: Default branch requires a PR and a green CI check before merge
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: master is not branch-protected (gh 404); CI is advisory.
    evidence:
      absent:
        command: gh api repos/marcelocantos/doit/branches/master/protection --jq .url

  # ================================ BUILD ================================
  - id: build.makefile
    dim: build
    desc: Makefile exposes build/test/vet/smoke/install
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {make_target: build}

  - id: build.go-version-pin
    dim: build
    desc: Go toolchain version pinned in go.mod (setup-go uses go-version-file)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go.mod, matches: '(?m)^go 1\.'}}

  - id: build.parallel-makeflags
    dim: build
    desc: Parallelism set via MAKEFLAGS in the Makefile, never passed as -j on the CLI
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: Makefile, matches: 'MAKEFLAGS \+= -j'}}

  - id: build.bullseye-invariants
    dim: build
    desc: "`make bullseye` is the standing local invariant hook (vet + test + build + clean tree)"
    state: present
    cadence: continuous
    enforce: informational
    tier: 2
    evidence: {make_target: bullseye}

  # ============================ DOCUMENTATION ============================
  - id: docs.bullseye
    dim: docs
    desc: bullseye.yaml is the intent ledger for followable work
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: bullseye.yaml}}

  - id: docs.stability
    dim: docs
    desc: STABILITY.md catalogues the public MCP/config/audit contract
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: STABILITY.md}}

  - id: docs.threat-model
    dim: docs
    desc: Threat model documents what the gatekeeper defends and what it does not
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {file: {path: docs/threat-model.md}}

  - id: docs.md-links
    dim: docs
    desc: Internal markdown links resolve (no dead cross-references)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No make target or CI step checks markdown links.
    evidence: {absent: {make_target: check-md-links}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Go benchmark suite exists and is runnable
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: No Benchmark functions or benches/ tree; latency is not tracked.
    evidence: {absent: {make_target: bench}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks (samples only).
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  - id: vcs.lfs-binaries
    dim: vcs
    desc: Large/binary assets tracked via Git LFS
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No large binary assets; the repo is Go source + markdown.
    evidence: {absent: {file: {path: .gitattributes}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.claude-md
    dim: agent
    desc: CLAUDE.md present (project conventions discoverable by agents)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: CLAUDE.md}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}

  - id: agent.help-agent
    dim: agent
    desc: Binary exposes --help-agent (embedded agents-guide.md)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: agents-guide.md}}

  - id: agent.cli-help
    dim: agent
    desc: Binary exposes --version and --help
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: cmd/doit/main.go, matches: '"--version"'}}
