schema_version: 1
targets:
  T1:
    name: MCP-first architecture
    status: achieved
    value: 5.0
    cost: 1.0
    acceptance:
    - TODO
    origin: manual
    discovered: 2026-04-09
  T10:
    name: L3→L2 auto-promotion detects stable patterns from decision history
    status: achieved
    value: 3.0
    cost: 3.0
    acceptance:
    - Semantic similarity grouping clusters similar L3 decisions (e.g., go test ./... variants)
    - Conditional branching detection identifies same command approved/denied based on different flags
    - Stable L3 patterns are proposed as L2 entries for human approval via elicitation
    - Auto-promotion runs after L3 decisions (tryPromote already exists, needs elicitation integration)
    context: The claudia session (🎯T8) can analyse L3 decision history for patterns. Instead of simple audit log analysis, the agent uses semantic understanding to cluster similar decisions and propose L2 entries. Runs as a periodic task within the existing claudia session.
    tags:
    - policy
    - claudia
    origin: roadmap — docs/todo.md Policy Migration
    discovered: 2026-04-10
    achieved: 2026-04-11
  T11:
    name: Spaced repetition review keeps learned policy fresh
    status: achieved
    value: 3.0
    cost: 2.0
    acceptance:
    - L2 entries have ReviewSchedule with next_review dates
    - Overdue entries are surfaced via doit_policy_status or a dedicated review tool
    - 'Review elicitation presents the entry and asks: keep, modify, or remove'
    - Review intervals use spaced repetition (increasing intervals after each confirmation)
    context: 'L2 entries have ReviewSchedule fields but review is never triggered. Without periodic review, learned policy accumulates stale entries that don''t reflect current project reality. Design doc section: Spaced Repetition Review.'
    tags:
    - policy
    origin: roadmap — design doc
    discovered: 2026-04-10
    achieved: 2026-04-11
  T12:
    name: Gatekeeper self-audit detects dangerous rule combinations and drift
    status: achieved
    value: 2.0
    cost: 3.0
    acceptance:
    - Periodic audit detects rules that are dangerous in combination
    - Flags rules that have drifted from current project reality
    - Identifies L3 patterns that should have been promoted but weren't
    - Surfaces inconsistencies between L1 Starlark rules and L2 learned entries
    context: The claudia session (🎯T8) can perform holistic rule set review. The agent reads all L1 Starlark rules and L2 entries, reasons about interactions, and flags dangerous combinations or drift. Runs as a periodic or on-demand task.
    tags:
    - policy
    - safety
    - claudia
    origin: roadmap — docs/todo.md Gatekeeper Self-Audit
    discovered: 2026-04-10
    achieved: 2026-04-11
  T13:
    name: Project context auto-discovery informs policy decisions
    status: achieved
    value: 3.0
    cost: 2.0
    acceptance:
    - Engine discovers project type from Makefile, go.mod, package.json, etc.
    - Project context influences L1/L2 evaluation (e.g., Go project allows go test)
    - CLAUDE.md is parsed for doit-relevant configuration hints
    - Context is passed to L3 for informed reasoning about command safety
    context: 'Currently doit treats all commands the same regardless of project context. A Go project should auto-allow go test, a Node project should allow npm test. Per-project config handles explicit rules but auto-discovery handles the common case. Design doc section: Global vs Repo-Level Policy.'
    tags:
    - policy
    - context
    origin: roadmap — docs/todo.md Global vs Repo-Level Policy
    discovered: 2026-04-10
    achieved: 2026-04-11
  T14:
    name: Session-scoped gatekeeper uses claudia for context-aware triage
    status: achieved
    value: 5.0
    cost: 3.0
    acceptance:
    - Worker can introduce a work session via doit_execute metadata (scope, description)
    - Session context persists across evaluations within a declared work session (no /clear)
    - Session agent makes faster, more informed decisions using accumulated work context
    - Session agent can pre-approve patterns within the declared scope
    - Session ends on worker signal or timeout, resuming per-command /clear behavior
    context: 'With L3 already running as a persistent claudia session (🎯T8), the session agent becomes an extension: workers can introduce a work session with scope/description, and the existing claudia session accumulates that context across evaluations (skip /clear for within-session commands). This builds on top of the L3 claudia integration rather than being a separate system.'
    tags:
    - policy
    - agent
    - claudia
    origin: roadmap — docs/todo.md Gatekeeper Capabilities
    discovered: 2026-04-10
    achieved: 2026-04-11
  T15:
    name: Gatekeeper has read-only repo access for claim verification
    status: achieved
    value: 2.0
    cost: 2.0
    acceptance:
    - Gatekeeper can read .gitignore to verify 'generated directory' claims
    - Gatekeeper can read build config to verify build-related command justifications
    - Read-only access is enforced — gatekeeper cannot modify the repo
    - Hardcoded allowlist governs which files the gatekeeper can read
    context: When an agent claims 'this directory is generated, safe to delete', the gatekeeper currently takes it at face value. With repo access, it can verify claims against .gitignore, build configs, etc.
    tags:
    - policy
    - safety
    origin: roadmap — docs/todo.md Gatekeeper Capabilities
    discovered: 2026-04-10
    achieved: 2026-04-11
  T16:
    name: doit is the sole execution path — agents have no direct Bash access
    status: achieved
    value: 8.0
    cost: 2.0
    acceptance:
    - Documentation and agents-guide instruct agents to use only doit_execute
    - Claude Code permission config denies Bash and routes through doit MCP tools
    - Worker CLAUDE.md audit tool verifies doit routing is configured correctly
    - Agents that attempt direct Bash are detected and flagged
    context: The entire security model depends on doit being the sole execution path. If an agent can bypass doit via direct Bash, all policy enforcement is theatre. This is about ensuring the deployment configuration enforces the architecture.
    tags:
    - safety
    - deployment
    origin: roadmap — design doc core principle
    discovered: 2026-04-10
    achieved: 2026-04-11
  T17:
    name: Engine treats commands as opaque strings; commands that match no specific L1 rule escalate to L2/L3
    status: achieved
    value: 20.0
    cost: 5.0
    observable: true
    acceptance:
    - checkSafePipeline is deleted from internal/policy/level1.go; there is no engine-level rule that auto-allows based on 'all segments are read-only' reasoning
    - policy.Segment.Tier is no longer populated by engine.evaluatePolicy; the policy.Request carries the raw command string and whatever metadata L1 pattern rules want to reconstruct themselves
    - dry_run of 'ls && rm -rf /' does NOT return allow L1 allow-safe-pipeline; decision is escalate (or deny by a specific rule)
    - dry_run of 'cat /etc/passwd > /tmp/stolen' does NOT return allow L1; escalates
    - dry_run of 'ls $(rm -rf /)' does NOT return allow L1; escalates
    - dry_run of 'ls `rm -rf /`' does NOT return allow L1; escalates
    - 'dry_run of ''echo hello'' (unknown capability) does NOT return allow L1; escalates (or denies with ''unknown capability: echo'')'
    - dry_run of 'git push' (bare, no --force) does NOT return allow L1; escalates
    - dry_run of bare 'ls' escalates unless a specific L1 rule has been added; do NOT add a whitelist to paper over this — L2 learns the pattern after one approval, or L3 reasons about it
    - dry_run of 'git push --force' remains denied by deny-git-push-flags (specific L1 pattern rule, unchanged)
    - dry_run of 'rm -rf /' remains denied by deny-rm-catastrophic (specific L1 pattern rule, unchanged)
    - A regression test suite in internal/policy/level1_test.go exercises every bypass listed above (&&, ||, ;, |, >, <, $(...), backticks, process substitution, echo, bare git push) and confirms none return 'allow L1 allow-safe-pipeline'
    - 'STABILITY.md is updated: the audit-log ''segments''/''tiers'' fields are documented as deprecated or empty post-T17 (they can remain in the schema for backwards compatibility but no new entries populate them)'
    context: |-
      **Architectural shift, not a bug fix.** The pre-v0.5.0 design assumed doit would tokenise commands into Pipeline → Segments and make tier-based decisions per segment. v0.5.0 removed the pipeline parser (commit f3d5a2d) and delegated shell composition to `sh -c`, but left behind three vestigial structures that don't survive the shift:

        1. `internal/policy/level1.go:251-266 checkSafePipeline` — iterates `req.Segments` and auto-allows if every segment is TierRead. Under v0.5.0, `req.Segments` is always length 1 (just `args[0]`), so "all segments are read-only" is vacuously true for any first-word-read-tier command.
        2. `engine/engine.go evaluatePolicy` — constructs a single synthetic `policy.Segment{CapName, Args, Tier}` from `args[0]` and the capability registry. This is engine-level tokenisation pretending to be segment analysis.
        3. `policy.Segment.Tier` threading through L1/L2 — every policy layer consumes a "tier" per segment, which is now just "tier of the first word".

      Why can't we fix this by parsing pipelines properly?

        - Process substitution: `diff <(sort a) <(sort b)` — nested pipelines inside `<(...)` that share no structure with the outer command.
        - Here-strings and here-docs: `cat <<< "data"`, `cat <<EOF\n...\nEOF`.
        - `eval "rm -rf $VAR"` — the actual command is only constructed at runtime.
        - `sh -c 'nested; composition'` — quoted shell passed as an argument to another shell.
        - `$IFS` / `noglob` / readonly arrays — word-splitting rules that change per-shell.
        - Function and alias expansion.
        - Multi-line commands embedded in `$(...)`.

      Only `bash` itself gets this right, and by the time you've invoked bash you're already running the command. Any parser doit embeds is a strictly weaker model of bash, and the gap is where the bypasses live.

      The right move: **stop trying to parse.** The engine treats `req.Command` as an opaque string and hands it to the policy chain. Each layer decides how much of the string it wants to inspect:

        - **L1**: pattern rules (Starlark or Go) that match the full command string against specific known-good or known-bad forms. `deny-rm-catastrophic`, `deny-git-push-flags`, `deny-git-reset-hard`, etc. These are *specific* patterns, not tier-based reasoning — they pattern-match the raw command string and return Allow/Deny/Escalate. Anything that doesn't match any L1 rule falls through.
        - **L2**: learned patterns — already works this way. Matches against the full command string.
        - **L3**: LLM reasons about the full command string in context. Already works this way.

      **No whitelist.** The user explicitly rejected the "small Starlark whitelist for safe single-command forms" approach. Commands that don't match a specific deny rule escalate. L2 learns them after one approval; L3 reasons about novel ones. Cold-start latency is real but correctness matters more than an extra `claude -p` call on the first `ls`.

      Concrete code changes:
        - Delete `checkSafePipeline` and its `allow-safe-pipeline` rule registration in `Level1.NewLevel1`.
        - Delete `allow-safe-pipeline` references in `level1_test.go`. Keep the positive test cases for specific deny rules.
        - `engine.evaluatePolicy`: stop constructing `policy.Segment`; pass `policy.Request{Command: req.Command}` through the chain. If L1 rules still want a capability-name hint they can parse it themselves from the first word.
        - `policy.Request.Segments` and `policy.Segment.Tier`: remove from the public policy API or mark deprecated. Update L1 pattern rules that read them to either scan the command string directly or read the first word.
        - `audit.Entry.Segments`/`Tiers`: stop populating from new writes. Either drop the fields or let them always be empty. STABILITY.md notes the change.

      This change subsumes 🎯T18 (redirects), 🎯T19 (command substitution), 🎯T23 (unknown-cap TierRead default), and 🎯T24 (capability Validate metacharacter rejection) — all four were symptoms of the same underlying "engine is parsing" mistake. They are retired as part of this reshape.

      🎯T20 (per-subcommand tier) also collapses into this, but slightly differently — see T20.

      Tags: security, architecture, critical, bypass
    tags:
    - security
    - parser
    - critical
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-13
  T18:
    name: Output redirection (&gt;, &gt;&gt;, &amp;&gt;) is recognized as a write operation
    status: achieved
    value: 13.0
    cost: 3.0
    acceptance:
    - dry_run of 'cat /etc/passwd > /tmp/stolen' requires TierWrite
    - dry_run of 'ls >> log.txt' requires TierWrite
    - dry_run of 'cmd &> log' requires TierWrite
    - A test case covers each redirect form
    context: |-
      Subsumed by 🎯T17. Output redirection (`>`, `>>`, `&>`) is a shell metacharacter that the v0.5.0 engine cannot reason about — the correct behaviour is to refuse the L1 auto-allow and escalate to L2/L3, exactly as T17 prescribes. The original framing (enforce TierWrite on redirects) predates the pipeline-parser removal and is no longer the right shape.

      Keep this target as a verify-level check that once T17 lands, the specific redirect forms are denied: `cat /etc/passwd > /tmp/stolen`, `ls >> log.txt`, `cmd &> log`. If T17's regression suite already covers these, this target can be retired.
    depends_on:
    - T17
    tags:
    - security
    - parser
    - critical
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-12
  T19:
    name: Command substitution ($(...) and backticks) is rejected or parsed recursively
    status: achieved
    value: 13.0
    cost: 5.0
    acceptance:
    - dry_run of 'ls $(rm -rf /)' is denied or the rm segment is seen and denied
    - dry_run of 'ls `rm -rf /`' is denied or the rm segment is seen and denied
    - Quoted substitutions inside strings are handled correctly
    - Variable expansion in argument positions ($PWD, ${HOME}) remains allowed
    context: |-
      Subsumed by 🎯T17. Command substitution (`$(...)`, backticks) is a shell metacharacter that the v0.5.0 engine cannot reason about. The T17 fix — reject L1 auto-allow on any unparsed metacharacter — closes this bypass as a side effect. If T17's acceptance tests cover `$(...)` and backtick forms, this target can be retired.

      The "stronger fix: recursively parse substitution bodies" path from the original context is rejected — it would re-introduce a parser, which v0.5.0 deliberately removed.
    depends_on:
    - T17
    tags:
    - security
    - parser
    - critical
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-12
  T2:
    name: sh -c execution model
    status: achieved
    value: 4.0
    cost: 1.0
    acceptance:
    - TODO
    origin: manual
    discovered: 2026-04-09
  T20:
    name: Per-subcommand tier helpers and unreachable Capability.Run() methods are deleted; tiers become advisory metadata only
    status: achieved
    value: 8.0
    cost: 2.0
    observable: true
    actual_cost: 2.0
    acceptance:
    - gitSubcommandTier() is deleted from internal/cap/builtin/git.go
    - goSubcommandTier() is deleted from internal/cap/builtin/go_cmd.go
    - Capability.Run() methods that were only reachable via the defunct pipeline parser are deleted
    - The cap.Capability interface's Run() method is removed OR downgraded to a stub that panics 'unreachable under MCP-first architecture', with a comment explaining that execution goes through engine.runShellCommand via sh -c
    - Tiers remain as advisory metadata on the Capability interface for doit_list_capabilities display and for the 'disable dangerous tier entirely' config switch (cfg.Tiers.Dangerous)
    - Tiers are NOT consulted during per-command policy evaluation — engine.evaluatePolicy does not call c.Tier() to gate allow/deny decisions
    - doit_list_capabilities output still shows tier classifications for each capability
    - 'The ''disable dangerous tier'' config gate still works: when cfg.Tiers.Dangerous is false, capabilities marked dangerous do not appear in doit_list_capabilities and any L1 rule that references them reports ''tier disabled in config'''
    - 'All tests still pass after the deletion: go vet ./..., go test ./..., go build ./...'
    context: |-
      The pre-T17 framing of this target ("add EffectiveTier(args []string) so git push becomes dangerous at eval time") assumed tiers drove policy decisions. Under the T17 architectural shift (engine treats commands as opaque strings, tiers are not consulted per-command), the EffectiveTier idea is obsolete — you don't need per-subcommand tiers in the engine path if the engine isn't using tiers at all.

      What's left is the dead-code cleanup:

        - `gitSubcommandTier()` in `internal/cap/builtin/git.go:41-56` — maps commit→write, push→dangerous, unknown→dangerous. Only called from `Git.Run()`, which is never invoked because execution goes through `engine.runShellCommand()` via `sh -c`. Delete.
        - `goSubcommandTier()` in `internal/cap/builtin/go_cmd.go:39-49` — same story for go install/run/generate → dangerous, build/test/vet → build. Delete.
        - `Capability.Run()` implementations that were only reached via the pipeline parser — delete them or downgrade to a stub with a panic("unreachable under MCP-first architecture") so any future regression to a parser-based path surfaces immediately.

      Tiers themselves stay as metadata for:
        - `doit_list_capabilities` display (users and agents want to see what's classified as read/write/dangerous)
        - The `cfg.Tiers.Dangerous` coarse config gate ("disable dangerous tier entirely") which operates at the capability-level, not per-command
        - Future L1 Starlark rules that want to reference tier as a label in their own reasoning

      This target can only land AFTER 🎯T17 is merged, because T17's deletion of `policy.Segment.Tier` is the upstream change. Sequence: T17 → T20.

      Tags: cleanup, architecture
    depends_on:
    - T17
    tags:
    - security
    - capabilities
    - critical
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-12
  T21:
    name: Executed commands log parsed segments and tiers to the audit log
    status: achieved
    value: 5.0
    cost: 2.0
    acceptance:
    - A doit_execute of 'cat foo | wc -l' produces an audit entry with segments=[cat,wc] and tiers=[read,read]
    - A doit_execute of 'git status' produces segments=[git]
    - Existing dry-run audit entries remain unchanged
    context: 'In the audit log, dry_run entries populate segments and tiers, but execute entries (e.g. seq 46-47 from the experimentation session) have segments: null, tiers: null. Root cause: runShellCommand (engine.go:1152) calls logExecution with nil segments/tiers (line 1188). evaluatePolicy already computes segments and tiers — they should be threaded through to logExecution so execute entries match dry_run entries for forensic analysis.'
    tags:
    - audit
    - observability
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-12
  T22:
    name: Sessions can be started with L1/L2-only configurations
    status: achieved
    value: 3.0
    cost: 2.0
    actual_cost: 2.0
    acceptance:
    - doit_session_start succeeds when L3 is disabled
    - Sessions group audit-log entries by session ID regardless of L3 status
    - L3-specific session features (context accumulation) degrade gracefully when L3 is off, without blocking the session itself
    context: Currently doit_session_start returns `L3 policy engine not available; sessions require L3`. Sessions have value beyond L3 context accumulation — they scope audit entries, give intent/description to a group of commands, and provide a natural unit for retrospective review. Decoupling session lifecycle from L3 availability lets users run doit with L1/L2 only and still get session-structured audit history.
    tags:
    - sessions
    - ux
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-12
  T23:
    name: Unknown capabilities are rejected or escalated, not silently defaulted to TierRead
    status: achieved
    value: 13.0
    cost: 2.0
    observable: true
    acceptance:
    - dry_run of 'echo hello' does NOT return allow L1 'all segments are read-only' (echo is not a registered capability)
    - dry_run of 'curl https://example.com' does NOT return allow L1 'all segments are read-only'
    - Default behaviour for unknown caps is escalate (so L2/L3 can reason) or deny (if L3 is off); neither silently grants TierRead
    - 'The error message or escalation reason names the missing capability: ''unknown capability: echo — register it in internal/cap/builtin/ or write a Starlark rule'''
    - A test in engine_test.go covers the unknown-capability path via the engine, not via direct policy.Level1 construction
    context: |-
      **v0.5.0 regression on top of the original bug**: dry_run of `echo hello` now returns `allow (Level 1) Rule: allow-safe-pipeline, Tiers: [read]`. Root cause: `engine.evaluatePolicy` defaults `tier := cap.TierRead` before the `reg.Lookup(capName)` call, and only overrides `tier` if the lookup succeeds. When the lookup fails, the request proceeds with Segments: [{CapName: echo, Tier: read}], which checkSafePipeline happily auto-allows.

      This is a second L1 bypass surface distinct from 🎯T17 — even a command with no shell metacharacters gets auto-allowed if its first word is any unknown identifier. Combined with T17, the L1 auto-allow rule currently greenlights ANY command starting with ANY word, as long as no registered-capability flag rule intervenes.

      Fix options (pick one):
        (a) Default to `cap.TierDangerous` when Lookup fails — forces escalation to L2/L3.
        (b) Return a synthetic Deny result from evaluatePolicy with a clear "unknown capability: $name" reason, so the dry_run output explains the decision.

      Option (b) is more user-friendly. Either way, the checkSafePipeline rule must not treat a defaulted-to-read tier as genuine read.

      Related to 🎯T17 but should land as a separate commit — the fix touches evaluatePolicy tier defaulting, not the metacharacter check.

      Tags: security, level1, critical, bypass, ux
    tags:
    - ux
    - error-messages
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-12
  T24:
    name: Capability Validate() rejects shell metacharacters in arguments
    status: achieved
    value: 8.0
    cost: 3.0
    acceptance:
    - ls.Validate() rejects args containing |, &, ;, >, <, $, `, \n
    - All capability Validate() methods share a common rejection helper
    - dry_run of 'ls -la | xargs rm -rf' is denied even if the tokenizer fix for 🎯T17 regresses
    - A test case covers each metacharacter
    context: |-
      Defense in depth: even once 🎯T17 correctly tokenizes shell metacharacters, individual capabilities currently accept ANY args — internal/cap/builtin/ls.go:20 has `func (l *Ls) Validate(args []string) error { return nil }`. This means if the tokenizer ever misses an edge case (unusual quoting, tab-separated operators, newline-embedded commands), junk args flow straight to sh -c. Capabilities should reject obviously-dangerous substrings in their args as a second line of defense.

      A shared helper in internal/cap/validate.go — `RejectShellMetacharacters(args []string) error` — can be called from every capability's Validate(). It should reject: | & ; < > ( ) ` $ \n \r and unbalanced quotes. Commands that need literal metacharacters can bypass via Starlark rules or L3 approval.

      This target is a safety net, not a primary fix. It makes 🎯T17 more robust.
    tags:
    - security
    - capabilities
    - defense-in-depth
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-12
  T25:
    name: deny-rm-catastrophic covers system directories and glob paths
    status: achieved
    value: 3.0
    cost: 2.0
    observable: true
    acceptance:
    - dry_run of 'rm -rf /usr' denied
    - dry_run of 'rm -rf /etc' denied
    - dry_run of 'rm -rf /bin' denied
    - dry_run of 'rm -rf /Users' denied
    - dry_run of 'rm -rf /*' denied (glob)
    - dry_run of 'rm -rf ~root' or '~otheruser' denied
    - Existing positive tests for '/', '.', '..', '~', '~/...' still pass
    context: |-
      **Partial coverage in v0.5.0 via L3.** Verified by dry_run 2026-04-12: both `rm -rf /*` and `rm -rf /usr` are denied at Level 3 by the llm-gatekeeper-session-fast rule, with clear reasoning about system-wide destruction. The L3 LLM catches the general class even though the L1 `deny-rm-catastrophic` rule only matches literal `/`, `.`, `..`, `~`, `~/...`.

      **Remaining gap**: L3 is not an acceptable safety net because (a) it depends on `policy.level3_enabled=true`, which the user can turn off, (b) it's non-deterministic — a different prompt or model revision could decide differently, and (c) catastrophic-rm is the textbook case for a hardcoded L1 rule, not a request for LLM judgment. The L1 `deny-rm-catastrophic` rule (`internal/policy/level1.go:186-218`) still needs extending to cover:
        - glob expansion: any arg containing an unescaped `*` combined with `-r`/`-R`
        - absolute system paths: `/usr`, `/etc`, `/bin`, `/sbin`, `/lib`, `/lib64`, `/System`, `/Library`, `/Users`, `/home`, `/var`, `/opt`, `/boot`, `/dev`, `/proc`, `/sys`
        - other-user home dirs: `~root`, `~someone` (any `~` followed by a non-`/` character)

      Maintain the blacklist as a package-level constant so it's easy to review and extend. Existing positive tests for `/`, `.`, `..`, `~`, `~/...` must continue to pass.

      Independent of 🎯T17 — this target is a specific L1 pattern rule, which is exactly the shape of L1 under the new architecture. It can land in parallel with T17 since they touch different rules in `internal/policy/level1.go` (T17 deletes `checkSafePipeline`, T25 extends `checkRmCatastrophic`). Minor merge-conflict risk on the level1.go rule registration list; resolvable mechanically.

      Value downgraded from 5 to 3 because L3 already catches the worst cases, but not retired — defense in depth matters and L3 coverage is not contractual.
    tags:
    - security
    - rules
    origin: discovered during doit experimentation session 2026-04-11
    discovered: 2026-04-11
    achieved: 2026-04-13
  T26:
    name: Commands carry time expectations that inform static analysis and runtime management
    status: achieved
    value: 5.0
    cost: 8.0
    acceptance:
    - MCP execute request schema accepts an optional time_expectation field (timeout_seconds and/or expected_duration_seconds)
    - L1 rules can access the time expectation and flag mismatches against known command profiles
    - Runtime execution enforces timeout_seconds if provided, killing the process on expiry
    - Audit log records expected vs actual duration for completed commands
    - L2 learns typical durations per command pattern and can flag anomalies
    context: 'Agents submitting commands to doit rarely know how long they''ll take, and doit has no way to reason about it. A time expectation (timeout, estimated duration, or both) attached to each request would enable two things: (1) static analysis — L1/L2 rules could flag suspicious mismatches (e.g., `sleep 3600` with a 10s expectation, or `make` with a 1s expectation), and (2) runtime management — doit could kill runaway processes, warn on unexpected delays, and collect timing data to improve L2 learned patterns. The expectation could come from the agent (MCP request field), from L2 learned history, or from project config.'
    depends_on:
    - T26.1
    - T26.2
    - T26.3
    origin: user idea, session 2026-04-13
    discovered: 2026-04-13
    achieved: 2026-04-19
  T26.1:
    name: MCP execute request accepts time expectations; runtime enforces timeout
    status: achieved
    value: 4.0
    cost: 3.0
