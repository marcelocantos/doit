    context: '🎯T26.3 landed per-pattern p50/p95 but keys globally on (cap, subcmd). For commands whose runtime is dominated by project size (make test, go test ./..., pytest, webpack), this pools wildly different distributions together and produces anomaly false-positives in both directions — a tiny repo''s expected=2s gets flagged against a monorepo''s p95, and a monorepo''s expected=120s gets flagged against a tiny repo''s p50. The engine already has `projectCtx` from 🎯T13 discovery; extending the aggregator key is a small change with outsized accuracy payoff. Open design question: what''s the canonical project_id? Likely the absolute path of the discovered project root, normalised. Needs a decision on how that round-trips through audit entries (currently they carry cwd, not project_root).'
