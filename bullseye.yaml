    - 'Tests cover: tracked file → write, untracked file → dangerous, recursive on tracked tree → dangerous, path outside any repo → dangerous, path under a bare/worktree-only repo → dangerous (conservative)'
    context: 'The read/build/write/dangerous tier system conflates two separate axes: intrinsic risk and reversibility. `rm foo.go` where foo.go is tracked is effectively equivalent to `git checkout HEAD -- foo.go` being available, so the user can always recover. `rm untracked-work.txt` is truly destructive. Right now both are dangerous-tier and both get the same escalation path, which produces false-positive escalations on routine work. Reversibility is a better reflective of actual risk than the raw command name. Scope-limit: only `rm` for now — generalising to other destructive operations (truncate redirects, `git reset --hard`) is a follow-up. Design note: the check shells out per evaluation. Cheap (single exec of git ls-files), but worth measuring before assuming it''s negligible. If it dominates evaluation latency, cache per-session via the existing session mechanism.'
