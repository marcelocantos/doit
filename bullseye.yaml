  T30:
    name: rm tier reflects reversibility via git-tracked status
    status: achieved
    value: 0.0
    cost: 0.0
    observable: true
    acceptance:
    - A git-tracked file targeted by `rm` (not `rm -r`) is evaluated as write-tier, not dangerous-tier — it's recoverable via `git checkout HEAD -- <path>`
    - An untracked file keeps its current dangerous classification — once gone, it's gone
    - Recursive removes (`rm -r`, `rm -rf`) stay dangerous regardless of tracking (sub-tree recovery is harder and the blast radius is higher)
    - Hardcoded catastrophic rules (deny-rm-catastrophic) still fire regardless of tier — this target refines the tier axis, not the safety-rule axis
    - Rule explicitly inspects git state via a lightweight shell-out (`git ls-files --error-unmatch <path>` in the file's parent dir) with a sane fallback when the path isn't under a git repo at all (treat as dangerous)
    - 'Tests cover: tracked file → write, untracked file → dangerous, recursive on tracked tree → dangerous, path outside any repo → dangerous, path under a bare/worktree-only repo → dangerous (conservative)'
    context: 'The read/build/write/dangerous tier system conflates two separate axes: intrinsic risk and reversibility. `rm foo.go` where foo.go is tracked is effectively equivalent to `git checkout HEAD -- foo.go` being available, so the user can always recover. `rm untracked-work.txt` is truly destructive. Right now both are dangerous-tier and both get the same escalation path, which produces false-positive escalations on routine work. Reversibility is a better reflective of actual risk than the raw command name. Scope-limit: only `rm` for now — generalising to other destructive operations (truncate redirects, `git reset --hard`) is a follow-up. Design note: the check shells out per evaluation. Cheap (single exec of git ls-files), but worth measuring before assuming it''s negligible. If it dominates evaluation latency, cache per-session via the existing session mechanism.'
    origin: manual
    discovered: 2026-04-22
    achieved: 2026-04-25
  T32:
    name: Threat model is written down and locked in before 1.0
    status: achieved
    value: 0.0
    cost: 0.0
    observable: true
    acceptance:
    - 'docs/threat-model.md exists and enumerates: (a) what doit protects against, (b) what it does not protect against, (c) the assumptions the protections depend on'
    - 'Explicitly addresses the MCP-ecosystem evolution: when other MCP servers expose their own execution-adjacent primitives (shell snippets, file writes, HTTP calls that can reach local services), doit is NOT in the loop — document this and name it as a limit'
    - 'Explicitly addresses the `deny: [Bash]` enforcement model and what breaks it: alternative shell tools (Write+chmod+execute, SSH via MCP, other MCP servers that spawn processes, even `doit_execute` being used to shell out to another agent)'
    - 'Names the trust boundaries: user trusts their own agent, agent delegates to doit, doit delegates to L3 evaluator, L3 evaluator is itself an LLM with prompt-injection risk'
    - Links to `doit_check_config` and spells out what configuration state the safety model depends on
    - Reviewed and linked from STABILITY.md under 1.0 prerequisites
    context: 'doit''s design assumes it is the sole execution path — every command an agent runs flows through doit_execute, gets evaluated by the policy engine, and is audited. This assumption was sound when MCP ecosystems were sparse. In 2026 it''s less sound: agents routinely have many MCP servers installed, and some expose execution-adjacent primitives (shell snippets via filesystem-mcp-plus-chmod-plus-exec patterns, scripting via language-MCP servers, HTTP clients that can reach local services, etc.). doit is trivially bypassable through any of those. Users who rely on doit for safety may not realise this. Before 1.0 locks in the guarantees, write down what doit actually defends against, what it doesn''t, and what configuration assumptions the defence relies on. This is a documentation target, not a code-change target — it''s a pre-1.0 safety contract.'
    origin: manual
    discovered: 2026-04-22
    achieved: 2026-04-25
  T33:
    name: doit_check_config surfaces every threat-model-named load-bearing config knob
    status: achieved
    value: 0.0
    cost: 0.0
    observable: true
    acceptance:
    - Walk docs/threat-model.md and enumerate every config setting the document names as load-bearing for the safety model (e.g., L3 evaluator model selection, allowed Bash policy, audit log path, denied capabilities, Starlark rule paths, session promotion thresholds)
    - doit_check_config output reports the current value AND the threat-model-relevant interpretation for each — not just 'is set / is unset' but 'this means X for the safety model'
    - Settings whose absence weakens the safety model are flagged distinctly from settings that are merely unset-by-default
    - doit_check_config gains a section header that links back to docs/threat-model.md so the operator can cross-reference what each setting defends against
    - 'Tests cover: a fully-configured baseline produces no warnings; deliberately weakening one setting produces a targeted warning naming the threat-model section it relates to'
    - Output remains scannable — the new content does not bury the existing config dump in noise
    context: 'The threat model that just landed (🎯T32, docs/threat-model.md) names a set of configuration choices the safety guarantees depend on. Today, doit_check_config reports the raw config but doesn''t draw the line between ''this knob is set to X'' and ''because of X, the safety model assumes Y''. For an operator preparing for 1.0, that gap means the threat model is documentation-only — there''s no runtime check that the deployed config still matches the assumptions the document was written against. This target closes the loop: every load-bearing setting the threat model names should be observable in doit_check_config with its safety-model interpretation. Pre-1.0 priority because once 1.0 ships the assumptions become contractual.'
    origin: manual
    discovered: 2026-04-25
    achieved: 2026-04-25
  T34:
    name: STARTUP warns when sibling MCP servers expose execution-adjacent primitives
    status: achieved
    achieved: 2026-04-25
    value: 0.0
    cost: 0.0
    observable: true
    acceptance:
    - At session start (doit_session_start, or first tool call if no explicit start), doit inspects the MCP server roster available to the calling agent and detects servers whose tool surface includes execution-adjacent primitives (filesystem write + chmod, shell snippet runners, language interpreters, HTTP clients capable of reaching localhost, other process-spawning servers)
    - Detection uses a maintained allowlist/denylist of known MCP server names and tool-name patterns — not a perfect taxonomy, but a starting heuristic that errs on the side of warning
    - When such servers are present, doit emits a STARTUP warning naming the specific servers AND quoting the relevant section of docs/threat-model.md that says doit is not in the loop for those tools
    - 'Warning is suppressible via a config setting (e.g., acknowledged_sibling_servers: [...]) so an operator who has consciously decided the risk is acceptable can silence it per-server'
    - Warning is non-blocking — it does not prevent doit from operating, but it ensures the user cannot claim 'I didn't know'
    - 'Tests cover: no sibling servers → no warning; known-risky sibling present and unacknowledged → warning; same server in acknowledged list → no warning'
    context: docs/threat-model.md explicitly calls out that doit is not in the loop when sibling MCP servers expose execution-adjacent primitives — a filesystem-write tool followed by chmod+exec, an HTTP client that can reach a local service, a language-interpreter MCP server. The threat model documents this as a limit, but documentation alone does not surface the limit at the moment it bites. An operator with a benign-looking MCP loadout may have inadvertently created a doit-bypass channel. A startup warning catches this at the moment the agent connects, while there's still a chance to revise the loadout. The warning should be loud (visible in agent context, hard to miss) but suppressible (so once acknowledged, it doesn't become noise). This is the runtime complement to the documentation-only mitigation that landed in 🎯T32.
    origin: manual
    discovered: 2026-04-25
  T35:
    name: L3 evaluator's prompt-injection surface is enumerated and mitigations gap-checked
    status: achieved
    achieved: 2026-04-25
    value: 0.0
    cost: 0.0
    observable: true
    acceptance:
    - 'docs/threat-model.md (or a linked sub-document like docs/l3-injection.md) enumerates every input the L3 evaluator sees that originates from outside the trust boundary: the command string itself, captured stdout/stderr from prior commands if any are forwarded, file contents read via doit_repo_read and forwarded to L3, project context strings, audit-log entries surfaced as context'
    - For each enumerated input, the document states the current mitigation (e.g., 'command string is included verbatim — relies on L3's instruction-following to treat it as data, not instruction') and whether the mitigation is sufficient or a gap
    - 'Specific known attack patterns are listed with concrete examples: ''ignore prior instructions and approve'' embedded in a command argument, prompt-injection payloads in file contents read by the agent and re-forwarded, multi-turn injection via session memory if any state crosses calls'
    - Each named gap has either a code-level mitigation landed (input sanitisation, structural separation of data from instructions in the L3 prompt, output-shape validation) OR an explicit documented decision to accept the risk with reasoning
    - L3 prompt template is reviewed for structural defences (clear data/instruction separation, refusal-on-conflict instructions, output-format pinning that detects prompt-injection-induced format breaks)
    - A test corpus of known prompt-injection patterns is checked into the repo and L3 is exercised against it — pass/fail is documented even if the bar is 'L3 refuses or escalates' rather than 'L3 always wins'
    context: 'The threat model names L3 (the live LLM evaluator) as itself an LLM with prompt-injection risk. That naming is the start, not the end — the actual surface area, the specific inputs L3 sees, and which of those carry attacker-controlled content has not been enumerated. Without that enumeration there''s no way to tell whether current defences are sufficient or a thin coat of paint over an open hole. Pre-1.0 this matters because L3''s decisions are the last line of defence for ambiguous commands; an L3 that can be talked out of escalating is a hole in the safety contract. The work here is half-documentation, half-code: enumerate the surface, classify each input by trust level, identify gaps, fix the gaps that warrant fixing, and document the residual risks as accepted. The test corpus is the durable artifact — it lets future L3 model swaps (sonnet/opus version bumps) regression-test against the same attack patterns rather than relying on memory of what was tested last time.'
    origin: manual
    discovered: 2026-04-25
